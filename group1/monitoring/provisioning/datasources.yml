apiVersion: 1

deleteDatasources:
  - name: Prometheus
    orgId: 1

  - name: ClickHouse
    orgId: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    editable: false

    jsonData:
      host: ch-s1-r1
      port: 8123
      protocol: http
      username: default
      defaultDatabase: ha
      secure: false
      dialTimeout: 10
      queryTimeout: 60
      validateSql: true