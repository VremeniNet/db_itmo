services:
  keeper1:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz3-keeper1
    hostname: keeper1
    command:
      [
        "clickhouse-keeper",
        "--config-file=/etc/clickhouse-keeper/keeper_config.xml",
      ]
    volumes:
      - ./config/keeper/keeper1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper1-data:/var/lib/clickhouse-keeper
    ports:
      - "9181:9181"

  keeper2:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz3-keeper2
    hostname: keeper2
    command:
      [
        "clickhouse-keeper",
        "--config-file=/etc/clickhouse-keeper/keeper_config.xml",
      ]
    volumes:
      - ./config/keeper/keeper2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper2-data:/var/lib/clickhouse-keeper
    ports:
      - "9182:9181"

  keeper3:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz3-keeper3
    hostname: keeper3
    command:
      [
        "clickhouse-keeper",
        "--config-file=/etc/clickhouse-keeper/keeper_config.xml",
      ]
    volumes:
      - ./config/keeper/keeper3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper3-data:/var/lib/clickhouse-keeper
    ports:
      - "9183:9181"

  ch1:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz3-ch1
    hostname: ch1
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/node1_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch1-data:/var/lib/clickhouse
    ports:
      - "8111:8123"
      - "9011:9000"

  ch2:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz3-ch2
    hostname: ch2
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/node2_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch2-data:/var/lib/clickhouse
    ports:
      - "8112:8123"
      - "9012:9000"

  ch3:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz3-ch3
    hostname: ch3
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/node3_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch3-data:/var/lib/clickhouse
    ports:
      - "8113:8123"
      - "9013:9000"

volumes:
  keeper1-data:
  keeper2-data:
  keeper3-data:
  ch1-data:
  ch2-data:
  ch3-data:
