services:
  keeper1:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-keeper1
    hostname: keeper1
    command:
      [
        "clickhouse-keeper",
        "--config-file=/etc/clickhouse-keeper/keeper_config.xml",
      ]
    volumes:
      - ./config/keeper/keeper1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper1-data:/var/lib/clickhouse-keeper
    ports:
      - "9281:9181"

  keeper2:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-keeper2
    hostname: keeper2
    command:
      [
        "clickhouse-keeper",
        "--config-file=/etc/clickhouse-keeper/keeper_config.xml",
      ]
    volumes:
      - ./config/keeper/keeper2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper2-data:/var/lib/clickhouse-keeper
    ports:
      - "9282:9181"

  keeper3:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-keeper3
    hostname: keeper3
    command:
      [
        "clickhouse-keeper",
        "--config-file=/etc/clickhouse-keeper/keeper_config.xml",
      ]
    volumes:
      - ./config/keeper/keeper3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper3-data:/var/lib/clickhouse-keeper
    ports:
      - "9283:9181"

  ch-s1-r1:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-ch-s1-r1
    hostname: ch-s1-r1
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/s1r1_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch-s1-r1-data:/var/lib/clickhouse
    ports:
      - "8211:8123"
      - "9111:9000"

  ch-s1-r2:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-ch-s1-r2
    hostname: ch-s1-r2
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/s1r2_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch-s1-r2-data:/var/lib/clickhouse
    ports:
      - "8212:8123"
      - "9112:9000"

  ch-s2-r1:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-ch-s2-r1
    hostname: ch-s2-r1
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/s2r1_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch-s2-r1-data:/var/lib/clickhouse
    ports:
      - "8221:8123"
      - "9121:9000"

  ch-s2-r2:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-ch-s2-r2
    hostname: ch-s2-r2
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/s2r2_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch-s2-r2-data:/var/lib/clickhouse
    ports:
      - "8222:8123"
      - "9122:9000"

  ch-s3-r1:
    image: clickhouse/clickhouse-server:26.5.1.882
    container_name: idz4-ch-s3-r1
    hostname: ch-s3-r1
    depends_on:
      - keeper1
      - keeper2
      - keeper3
    volumes:
      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/s3r1_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch-s3-r1-data:/var/lib/clickhouse
    ports:
      - "8231:8123"
      - "9131:9000"

  ch-s3-r2:
