      - ./config/clickhouse/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/clickhouse/s3r2_macros.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ./config/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ch-s3-r2-data:/var/lib/clickhouse
    ports:
      - "8232:8123"
      - "9132:9000"

volumes:
  keeper1-data:
  keeper2-data:
  keeper3-data:
  ch-s1-r1-data:
  ch-s1-r2-data:
  ch-s2-r1-data:
  ch-s2-r2-data:
  ch-s3-r1-data:
  ch-s3-r2-data:
