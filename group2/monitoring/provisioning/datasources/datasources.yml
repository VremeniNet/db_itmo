apiVersion: 1

deleteDatasources:
  - name: PostgreSQL
    orgId: 1

  - name: ClickHouse
    orgId: 1

datasources:
  - name: PostgreSQL
    uid: postgresql
    type: postgres
    access: proxy
    url: postgres:5432
    user: postgres
    isDefault: true
    editable: false

    secureJsonData:
      password: postgres

    jsonData:
      database: ecommerce
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 20
      maxIdleConns: 10
      connMaxLifetime: 14400

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: false
    editable: false

    jsonData:
      host: ch-s1-r1
      port: 8123
      protocol: http
      username: default
      defaultDatabase: ecommerce
      secure: false
      dialTimeout: 10
      queryTimeout: 60
      validateSql: true